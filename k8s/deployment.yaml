apiVersion: apps/v1
kind: Deployment
metadata:
  name: your-ai-website-buddy
  namespace: default
  labels:
    app: your-ai-website-buddy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: your-ai-website-buddy
  template:
    metadata:
      labels:
        app: your-ai-website-buddy
    spec:
      containers:
        - name: web
          image: REGISTRY/NAMESPACE/IMAGE:TAG
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-buddy-secrets
                  key: GEMINI_API_KEY
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
