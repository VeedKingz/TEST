# This workflow builds and pushes a container image to Alibaba Cloud Container Registry (ACR),
# and deploys it to Alibaba Cloud Container Service for Kubernetes (ACK) on pushes to main.

name: Build and Deploy to ACK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Environment variables configured for Your AI Website Buddy
env:
  REGION_ID: ${{ secrets.ALICLOUD_REGION_ID || 'cn-hangzhou' }}
  REGISTRY: ${{ secrets.ALICLOUD_REGISTRY || 'registry.cn-hangzhou.aliyuncs.com' }}
  NAMESPACE: ${{ secrets.ALICLOUD_NAMESPACE || 'ai-buddy' }}
  IMAGE: ${{ secrets.ALICLOUD_IMAGE || 'your-ai-website-buddy' }}
  TAG: ${{ github.sha }}
  ACK_CLUSTER_ID: ${{ secrets.ACK_CLUSTER_ID }}
  ACK_DEPLOYMENT_NAME: your-ai-website-buddy

  # Optional: Only needed if using ACR Enterprise Edition (EE)
  ACR_EE_REGISTRY: ${{ secrets.ACR_EE_REGISTRY || '' }}
  ACR_EE_INSTANCE_ID: ${{ secrets.ACR_EE_INSTANCE_ID || '' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # 1.1 Login to ACR (Standard / Personal Edition)
    - name: Login to ACR with AccessKey
      uses: aliyun/acr-login@v1
      with:
        region-id: "${{ env.REGION_ID }}"
        access-key-id: "${{ secrets.ACCESS_KEY_ID }}"
        access-key-secret: "${{ secrets.ACCESS_KEY_SECRET }}"

    # 1.2 Build and push image to ACR
    - name: Build and push image to ACR
      run: |
        docker build --tag "$REGISTRY/$NAMESPACE/$IMAGE:$TAG" --tag "$REGISTRY/$NAMESPACE/$IMAGE:latest" .
        docker push "$REGISTRY/$NAMESPACE/$IMAGE:$TAG"
        docker push "$REGISTRY/$NAMESPACE/$IMAGE:latest"

    # 1.3 Scan image in ACR (non-blocking)
    - name: Scan image in ACR
      uses: aliyun/acr-scan@v1
      continue-on-error: true
      with:
        region-id: "${{ env.REGION_ID }}"
        access-key-id: "${{ secrets.ACCESS_KEY_ID }}"
        access-key-secret: "${{ secrets.ACCESS_KEY_SECRET }}"
        repository: "${{ env.NAMESPACE }}/${{ env.IMAGE }}"
        tag: "${{ env.TAG }}"

    # 2.1 (Optional) Login to ACR EE - only runs if configured
    - name: Login to ACR EE with the AccessKey pair
      if: env.ACR_EE_INSTANCE_ID != ''
      uses: aliyun/acr-login@v1
      with:
        login-server: "https://${{ env.ACR_EE_REGISTRY }}"
        region-id: "${{ env.REGION_ID }}"
        access-key-id: "${{ secrets.ACCESS_KEY_ID }}"
        access-key-secret: "${{ secrets.ACCESS_KEY_SECRET }}"
        instance-id: "${{ env.ACR_EE_INSTANCE_ID }}"

    # 2.2 (Optional) Push to ACR EE
    - name: Build and push image to ACR EE
      if: env.ACR_EE_INSTANCE_ID != ''
      run: |
        docker build -t "$ACR_EE_REGISTRY/$NAMESPACE/$IMAGE:$TAG" .
        docker push "$ACR_EE_REGISTRY/$NAMESPACE/$IMAGE:$TAG"

    # 3.1 Set ACK K8s context
    - name: Set K8s context
      uses: aliyun/ack-set-context@v1
      with:
        access-key-id: "${{ secrets.ACCESS_KEY_ID }}"
        access-key-secret: "${{ secrets.ACCESS_KEY_SECRET }}"
        cluster-id: "${{ env.ACK_CLUSTER_ID }}"

    # 3.2 Set up reliable Kustomize binary
    - name: Set up Kustomize
      run: |
        curl -sLO https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
        tar -zxvf kustomize_v5.4.3_linux_amd64.tar.gz
        chmod +x ./kustomize

    # 3.3 Create/Update Gemini AI Secrets in ACK
    - name: Apply Gemini Secrets
      run: |
        if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
          kubectl create secret generic ai-buddy-secrets \
            --from-literal=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -
        fi

    # 3.4 Deploy to the ACK cluster
    - name: Deploy
      run: |
        ./kustomize edit set image REGISTRY/NAMESPACE/IMAGE:TAG=$REGISTRY/$NAMESPACE/$IMAGE:$TAG
        ./kustomize build . | kubectl apply -f -
        kubectl rollout status deployment/$ACK_DEPLOYMENT_NAME --timeout=180s
        kubectl get services -o wide
